name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Install ImageMagick
      run: sudo apt-get update && sudo apt-get install -y imagemagick libmagickwand-dev
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.2'
        bundler-cache: true
    - name: Setup deploy options
      id: setup
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [[ ${GITHUB_REF} = refs/pull/*/merge ]]; then # pull request
          echo "SRC_BRANCH=${GITHUB_HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "NO_PUSH=--no-push" >> "$GITHUB_OUTPUT"
        elif [[ ${GITHUB_REF} = refs/heads/* ]]; then # branch, e.g. master, source etc
          echo "SRC_BRANCH=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
        fi
        echo "DEPLOY_BRANCH=gh-pages" >> "$GITHUB_OUTPUT"
    - name: Deploy website
      env:
        SRC_BRANCH: ${{ steps.setup.outputs.SRC_BRANCH }}
        DEPLOY_BRANCH: ${{ steps.setup.outputs.DEPLOY_BRANCH }}
        NO_PUSH: ${{ steps.setup.outputs.NO_PUSH }}
      run: |
        deploy_args=(--verbose --src "$SRC_BRANCH" --deploy "$DEPLOY_BRANCH")
        if [[ "$NO_PUSH" == "--no-push" ]]; then deploy_args+=(--no-push); fi
        printf 'y\n' | bin/deploy "${deploy_args[@]}"
